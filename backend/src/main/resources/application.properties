spring.application.name=json-sarp

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/jsonshare;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 konsolu kapali: acik oldugunda paylasilan JSON'lar veritabanindan degistirilebilir
# ve paylasimlarin salt okunur olma garantisi kalkar.
spring.h2.console.enabled=false

# Paylasim linklerinde kullanilan taban adres. Deploy ederken gercek adresle degistirin.
jsonsarp.public-base-url=http://localhost:5173

# Tek bir paylasimda saklanabilecek en buyuk JSON boyutu (byte).
jsonsarp.share.max-bytes=2097152

# Istek govdesi ust siniri (paylasim limitinin uzerinde bir guvenlik siniri).
server.tomcat.max-swallow-size=4MB
spring.servlet.multipart.max-request-size=4MB

# XSD: bos birakilirsa classpath ve bilinen dizinler taranir
jsonsarp.xsd.path=
